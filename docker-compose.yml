services:
  backend:
    image: ${DOCKER_USERNAME:-plexusauto}/plexus-backend:latest
    container_name: plexus-backend
    environment:
      BC_CLIENT_ID: ${BC_CLIENT_ID}
      BC_CLIENT_SECRET: ${BC_CLIENT_SECRET}
      BC_TENANT_ID: ${BC_TENANT_ID}
      BC_ENVIRONMENT: ${BC_ENVIRONMENT}
      BC_COMPANY_ID: ${BC_COMPANY_ID}
      BC_BASE_URL: ${BC_BASE_URL}
      BC_SYSTEM_API_URL: ${BC_SYSTEM_API_URL}
      BC_TAREK_SYSTEM_API_URL: ${BC_TAREK_SYSTEM_API_URL}
      BC_TOKEN_URI: ${BC_TOKEN_URI}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Both hosts: nginx serves plexus-tec.com and www.plexus-tec.com, and the browser
      # calls the backend at www — so a visitor on the bare domain is cross-origin.
      APP_CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://plexus-tec.com,https://www.plexus-tec.com}
      # Partner API (commercial mobile app backend). Unset => /api/partner/** stays closed.
      PARTNER_API_KEY: ${PARTNER_API_KEY:-}
      DEMANDE_DEVIS_CUSTOMER_NO: ${DEMANDE_DEVIS_CUSTOMER_NO:-C0090}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      BRIS_UPLOADS_DIR: ${BRIS_UPLOADS_DIR:-/data/uploads/bris-de-glace}
      ACTIVITY_LOG_DIR: ${ACTIVITY_LOG_DIR:-/data/activity-log}
      ACTIVITY_LOG_RETENTION_MONTHS: ${ACTIVITY_LOG_RETENTION_MONTHS:-24}
      ACTIVITY_LOG_ADMIN_CUSTOMER_NO: ${ACTIVITY_LOG_ADMIN_CUSTOMER_NO:-C0082}
    volumes:
      - bris_uploads:/data/uploads/bris-de-glace
      # Journal d'activité: must survive container replacement, like the bris uploads.
      - activity_logs:/data/activity-log
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always

  frontend:
    image: ${DOCKER_USERNAME:-plexusauto}/plexus-frontend:latest
    container_name: plexus-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://plexus-tec.com}
      NEXT_APP_INTERNAL_BACKEND_URL: ${NEXT_APP_INTERNAL_BACKEND_URL:-http://backend:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://plexus-tec.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-LlKq6ZtYbr+hTC073mAmAh9/h2HwMfsFo4hrfCx5mLg=}
      NEXT_APP_JWT_SECRET: ${NEXT_APP_JWT_SECRET:-ikRgjkhi15HJiU78-OLKfjngiu-SECRET-PW-32-CHARS}
      NEXT_APP_JWT_TIMEOUT: ${NEXT_APP_JWT_TIMEOUT:-86400}
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: "0.0.0.0"
    healthcheck:
      # node:20-slim has no wget/curl — use node's built-in fetch instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always

  nginx:
    image: nginx:alpine
    container_name: makrem-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: always
    # Reload every 6h so renewed certs are actually picked up: nginx caches the
    # cert in memory at startup, so a renewal on disk is invisible until reload.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: makrem-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # MUST be `entrypoint:`, not `command:` — this image has ENTRYPOINT ["certbot"],
    # so a `command:` shell string is passed as ARGS TO CERTBOT (it read the `-c` as
    # --config and crash-looped, which is why the cert silently expired 2026-07-26).
    # --webroot is explicit here: don't rely on the authenticator in renewal/*.conf.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bris_uploads:
  activity_logs:
