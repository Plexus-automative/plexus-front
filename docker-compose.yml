services:
  backend:
    image: ${DOCKER_USERNAME:-plexusauto}/plexus-backend:latest
    container_name: plexus-backend
    environment:
      BC_CLIENT_ID: ${BC_CLIENT_ID}
      BC_CLIENT_SECRET: ${BC_CLIENT_SECRET}
      BC_TENANT_ID: ${BC_TENANT_ID}
      BC_ENVIRONMENT: ${BC_ENVIRONMENT}
      BC_COMPANY_ID: ${BC_COMPANY_ID}
      BC_BASE_URL: ${BC_BASE_URL}
      BC_SYSTEM_API_URL: ${BC_SYSTEM_API_URL}
      BC_TAREK_SYSTEM_API_URL: ${BC_TAREK_SYSTEM_API_URL}
      BC_TOKEN_URI: ${BC_TOKEN_URI}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Both hosts: nginx serves plexus-tec.com and www.plexus-tec.com, and the browser
      # calls the backend at www — so a visitor on the bare domain is cross-origin.
      APP_CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://plexus-tec.com,https://www.plexus-tec.com}
      # Partner API (commercial mobile app backend). Unset => /api/partner/** stays closed.
      PARTNER_API_KEY: ${PARTNER_API_KEY:-}
      # Web Push (VAPID). Unset => push is disabled and the portal falls back to the
      # in-page notification, which only works while a tab is open.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@plexus-tec.com}
      DEMANDE_DEVIS_CUSTOMER_NO: ${DEMANDE_DEVIS_CUSTOMER_NO:-C0090}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      BRIS_UPLOADS_DIR: ${BRIS_UPLOADS_DIR:-/data/uploads/bris-de-glace}
      ACTIVITY_LOG_DIR: ${ACTIVITY_LOG_DIR:-/data/activity-log}
      ACTIVITY_LOG_RETENTION_MONTHS: ${ACTIVITY_LOG_RETENTION_MONTHS:-24}
      ACTIVITY_LOG_ADMIN_CUSTOMER_NO: ${ACTIVITY_LOG_ADMIN_CUSTOMER_NO:-C0082}
    volumes:
      - bris_uploads:/data/uploads/bris-de-glace
      # Journal d'activité: must survive container replacement, like the bris uploads.
      - activity_logs:/data/activity-log
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always

  # Bac à sable de l'API partenaire : MÊME image que `backend`, autre société BC.
  #
  # L'isolation tient à une seule variable — BC_COMPANY_ID. Les identifiants Business
  # Central sont les mêmes et voient toutes les sociétés du tenant, donc c'est bien cette
  # ligne, et elle seule, qui empêche l'app commerciale d'écrire dans la vraie base.
  # La clé partenaire est différente exprès : si le développeur se trompe d'URL, il prend
  # un 401 au lieu de créer une commande en production.
  backend-dev:
    # Tag distinct de la production, exprès. Avec un `:latest` partagé, pousser une image
    # pour tester ici la mettrait aussi sous le nez de la prod, qui la prendrait au premier
    # redémarrage venu — un correctif à moitié testé passerait en production sans que
    # personne l'ait décidé.
    image: ${DOCKER_USERNAME:-plexusauto}/plexus-backend:${BACKEND_DEV_TAG:-dev}
    container_name: plexus-backend-dev
    environment:
      BC_CLIENT_ID: ${BC_CLIENT_ID}
      BC_CLIENT_SECRET: ${BC_CLIENT_SECRET}
      BC_TENANT_ID: ${BC_TENANT_ID}
      BC_ENVIRONMENT: ${BC_ENVIRONMENT}
      BC_COMPANY_ID: ${BC_DEV_COMPANY_ID:?BC_DEV_COMPANY_ID must be set — the whole point of this service}
      # ATTENTION — les trois URL portent DÉJÀ la société en prod
      # (`…/v2.0/companies(FDCEC2EC-…)`), et le code ne rajoute `BC_COMPANY_ID` que
      # si l'URL n'en contient pas :
      #     if (!baseUrl.contains("/companies(")) baseUrl += companyPath;
      # Donner ici les URL de prod ferait donc lire ET ÉCRIRE ce bac à sable dans la
      # base de production, `BC_COMPANY_ID` étant purement ignoré. Elles doivent porter
      # la société de test — c'est ça, et non BC_COMPANY_ID, qui isole réellement.
      BC_BASE_URL: ${BC_DEV_BASE_URL:?BC_DEV_BASE_URL must carry the TEST company, or this writes to production}
      BC_SYSTEM_API_URL: ${BC_DEV_SYSTEM_API_URL:?BC_DEV_SYSTEM_API_URL must carry the TEST company}
      BC_TAREK_SYSTEM_API_URL: ${BC_DEV_TAREK_SYSTEM_API_URL:?BC_DEV_TAREK_SYSTEM_API_URL must carry the TEST company}
      BC_TOKEN_URI: ${BC_TOKEN_URI}
      JWT_SECRET: ${JWT_SECRET_DEV:?JWT_SECRET_DEV must be set — distinct from prod}
      PARTNER_API_KEY: ${PARTNER_API_KEY_DEV:-}
      DEMANDE_DEVIS_CUSTOMER_NO: ${DEMANDE_DEVIS_CUSTOMER_NO:-C0090}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED_DEV:-false}
      BRIS_UPLOADS_DIR: /data/uploads/bris-de-glace
      ACTIVITY_LOG_DIR: /data/activity-log
    volumes:
      # Volumes séparés : le journal d'activité du bac à sable ne doit pas se mélanger
      # à celui de la production, qui sert d'audit.
      - bris_uploads_dev:/data/uploads/bris-de-glace
      - activity_logs_dev:/data/activity-log
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  frontend:
    image: ${DOCKER_USERNAME:-plexusauto}/plexus-frontend:latest
    container_name: plexus-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://plexus-tec.com}
      NEXT_APP_INTERNAL_BACKEND_URL: ${NEXT_APP_INTERNAL_BACKEND_URL:-http://backend:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://plexus-tec.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-LlKq6ZtYbr+hTC073mAmAh9/h2HwMfsFo4hrfCx5mLg=}
      NEXT_APP_JWT_SECRET: ${NEXT_APP_JWT_SECRET:-ikRgjkhi15HJiU78-OLKfjngiu-SECRET-PW-32-CHARS}
      NEXT_APP_JWT_TIMEOUT: ${NEXT_APP_JWT_TIMEOUT:-86400}
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: "0.0.0.0"
    healthcheck:
      # node:20-slim has no wget/curl — use node's built-in fetch instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always

  nginx:
    image: nginx:alpine
    container_name: makrem-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: always
    # Reload every 6h so renewed certs are actually picked up: nginx caches the
    # cert in memory at startup, so a renewal on disk is invisible until reload.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: makrem-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # MUST be `entrypoint:`, not `command:` — this image has ENTRYPOINT ["certbot"],
    # so a `command:` shell string is passed as ARGS TO CERTBOT (it read the `-c` as
    # --config and crash-looped, which is why the cert silently expired 2026-07-26).
    # --webroot is explicit here: don't rely on the authenticator in renewal/*.conf.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bris_uploads:
  activity_logs:
  bris_uploads_dev:
  activity_logs_dev:
