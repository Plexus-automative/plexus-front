server {
    listen 80;
    server_name plexus-tec.com www.plexus-tec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name plexus-tec.com www.plexus-tec.com;

    ssl_certificate /etc/letsencrypt/live/plexus-tec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plexus-tec.com/privkey.pem;
    
    client_max_body_size 500M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Security: Block sensitive files and common exploits
    location ~ /\.(env|git|htaccess|passwd) {
        deny all;
        return 404;
    }

    location ~ \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        return 404;
    }

    location ~* /(cgi-bin|wp-content|wp-admin|wp-includes|xmlrpc\.php) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Next-Auth internal calls to Frontend
    location /api/auth/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API calls
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}

# ---------------------------------------------------------------------------
# mobile.plexus-tec.com — AutoReport backend (repo: Plexus-automative/app-plexus-tec)
#
# These blocks MUST live here. scripts/deploy.sh scps this file over
# /home/ubuntu/piece-app/nginx/nginx.conf, so anything added only on the server
# is silently erased by the next deploy — which is exactly what happened on
# 2026-08-05 and left the mobile app broken for ~17h.
#
# The AutoReport stack is a separate compose project in /home/ubuntu/autoreport,
# attached to the piece-app_default network. It is NOT managed by this repo.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name mobile.plexus-tec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mobile.plexus-tec.com;

    # Issued 2026-08-05, renewed by the existing certbot container.
    # NOTE: if this file is ever deployed to a server that lacks this cert,
    # `nginx -t` fails and deploy.sh will refuse to reload (it will not break
    # the running config, but the deploy reports failure until the cert exists).
    ssl_certificate     /etc/letsencrypt/live/mobile.plexus-tec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile.plexus-tec.com/privkey.pem;

    # Photos and attachments: the app allows 20MB/file, 80MB/request.
    client_max_body_size 100M;

    proxy_connect_timeout 120s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # CRITICAL: resolve the upstream at REQUEST time, not at config-load time.
    #
    # A literal `proxy_pass http://autoreport-api:8082` is resolved when nginx
    # loads its config. If nginx is ever restarted while autoreport-api is
    # stopped, it would fail with "host not found in upstream" and REFUSE TO
    # START — taking the live plexus-tec.com site down over an unrelated
    # service. Going through a variable defers resolution, so a dead AutoReport
    # degrades to a 502 on this vhost alone.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $autoreport http://autoreport-api:8082;
        proxy_pass $autoreport;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded photos and attachments, served by the app's /uploads/** handler.
    location /uploads/ {
        set $autoreport http://autoreport-api:8082;
        proxy_pass $autoreport;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep ACME reachable so renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
